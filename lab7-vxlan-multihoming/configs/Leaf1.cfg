Leaf1#sh run
! Command: show running-config
! device: Leaf1 (vEOS-lab, EOS-4.33.1.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Leaf1
!
spanning-tree mode mstp
no spanning-tree vlan-id 4094
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 10
   name CLIENTS_VLAN10
!
vlan 4094
   name MLAG_PEER
!
interface Port-Channel10
   description MLAG_TO_HOST1_BOND0_STATIC
   switchport access vlan 10
   mlag 10
   spanning-tree portfast
!
interface Port-Channel100
   description MLAG_PEER_LINK_TO_LEAF2
   switchport trunk allowed vlan 10,4094
   switchport mode trunk
!
interface Ethernet1
   description TO_SPINE1_E1
   no switchport
   ip address 10.0.0.1/31
!
interface Ethernet2
   description TO_LEAF2_E2_MLAG_PEER
   channel-group 100 mode active
!
interface Ethernet3
   description TO_LEAF2_E3_MLAG_PEER
   channel-group 100 mode active
!
interface Ethernet4
   description TO_HOST1_E0
   channel-group 10 mode on
!
interface Ethernet5
   description TO_SPINE2_E3
   no switchport
   ip address 10.0.0.7/31
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Loopback0
   ip address 11.11.11.11/32
!
interface Loopback1
   description MLAG_ANYCAST_VTEP
   ip address 100.100.100.12/32
!
interface Management1
!
interface Vlan10
   description CLIENTS_GW
   ip address virtual 10.10.10.1/24
!
interface Vlan4094
   description MLAG_CONTROL
   no autostate
   ip address 192.168.255.1/30
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
!
mlag configuration
   domain-id MLAG_LEAF1_LEAF2
   local-interface Vlan4094
   peer-address 192.168.255.2
   peer-link Port-Channel100
!
router bgp 65101
   router-id 11.11.11.11
   neighbor 10.0.0.0 remote-as 65000
   neighbor 10.0.0.0 send-community extended
   neighbor 10.0.0.6 remote-as 65001
   neighbor 10.0.0.6 send-community extended
   !
   vlan 10
      rd 11.11.11.11:10010
      route-target both 10010:10010
      redistribute learned
      redistribute learned remote
   !
   address-family evpn
      neighbor 10.0.0.0 activate
      neighbor 10.0.0.6 activate
   !
   address-family ipv4
      neighbor 10.0.0.0 activate
      neighbor 10.0.0.6 activate
      network 11.11.11.11/32
      network 100.100.100.12/32
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
