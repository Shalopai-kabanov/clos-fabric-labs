Leaf3#sh run
! Command: show running-config
! device: Leaf3 (vEOS-lab, EOS-4.33.1.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Leaf3
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 10
   name CLIENTS_VLAN10
!
interface Ethernet1
   description TO_SPINE1_E3
   no switchport
   ip address 10.0.0.5/31
!
interface Ethernet2
   description TO_SPINE2_E1
   no switchport
   ip address 10.0.0.11/31
!
interface Ethernet3
   description TO_HOST2_E0
   switchport access vlan 10
   spanning-tree portfast
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Loopback0
   ip address 33.33.33.33/32
!
interface Loopback1
   description VTEP
   ip address 100.100.100.3/32
!
interface Management1
!
interface Vlan10
   description CLIENTS_GW
   ip address virtual 10.10.10.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
!
router bgp 65103
   router-id 33.33.33.33
   neighbor 10.0.0.4 remote-as 65000
   neighbor 10.0.0.4 send-community extended
   neighbor 10.0.0.10 remote-as 65001
   neighbor 10.0.0.10 send-community extended
   !
   vlan 10
      rd 33.33.33.33:10010
      route-target both 10010:10010
      redistribute learned
      redistribute learned remote
   !
   address-family evpn
      neighbor 10.0.0.4 activate
      neighbor 10.0.0.10 activate
   !
   address-family ipv4
      neighbor 10.0.0.4 activate
      neighbor 10.0.0.10 activate
      network 33.33.33.33/32
      network 100.100.100.3/32
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
