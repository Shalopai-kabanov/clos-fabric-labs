Spine1#sh run 
! Command: show running-config
! device: Spine1 (vEOS-lab, EOS-4.33.1.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Spine1
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
interface Ethernet1
   description TO_LEAF1_E2
   no switchport
   ip address 10.0.0.2/31
   ip ospf network point-to-point
!
interface Ethernet2
   description TO_LEAF2_E2
   no switchport
   ip address 10.0.0.4/31
   ip ospf network point-to-point
!
interface Ethernet3
   description TO_LEAF3_E1
   no switchport
   ip address 10.0.0.6/31
   ip ospf network point-to-point
!
interface Ethernet4
   description TO_LEAF4_E1
   no switchport
   ip address 10.0.0.8/31
   ip ospf network point-to-point
!
interface Ethernet5
   description TO_SPINE2_E5
   no switchport
   ip address 10.0.0.0/31
   ip ospf network point-to-point
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Loopback0
   ip address 1.1.1.1/32
!
interface Management1
!
ip routing
!
router bgp 65000
   router-id 1.1.1.1
   maximum-paths 8
   neighbor 10.0.0.1 remote-as 65001
   neighbor 10.0.0.3 remote-as 65101
   neighbor 10.0.0.5 remote-as 65102
   neighbor 10.0.0.7 remote-as 65103
   neighbor 10.0.0.9 remote-as 65104
   redistribute connected
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
