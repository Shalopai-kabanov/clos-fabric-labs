Leaf3#sh run
! Command: show running-config
! device: Leaf3 (vEOS-lab, EOS-4.33.1.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Leaf3
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 30
   name HOST3_VLAN30
!
vrf instance TENANT
!
interface Ethernet1
   description TO_SPINE2
   no switchport
   ip address 10.0.0.13/31
!
interface Ethernet2
   description TO_SPINE1
   no switchport
   ip address 10.0.0.5/31
!
interface Ethernet3
   description TO_HOST3
   switchport access vlan 30
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
!
interface Ethernet12
!
interface Loopback0
   ip address 33.33.33.33/32
!
interface Loopback1
   ip address 100.100.100.3/32
!
interface Management1
!
interface Vlan30
   description HOST3_GW
   vrf TENANT
   ip address virtual 10.30.30.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 30 vni 10030
   vxlan vrf TENANT vni 50000
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf TENANT
!
router bgp 65103
   router-id 33.33.33.33
   neighbor 10.0.0.4 remote-as 65000
   neighbor 10.0.0.4 send-community extended
   neighbor 10.0.0.12 remote-as 65001
   neighbor 10.0.0.12 send-community extended
   !
   vlan 30
      rd 100.100.100.3:10030
      route-target both 10030:10030
      redistribute learned
      redistribute learned remote
   !
   address-family evpn
      neighbor 10.0.0.4 activate
      neighbor 10.0.0.12 activate
   !
   address-family ipv4
      neighbor 10.0.0.4 activate
      neighbor 10.0.0.12 activate
      network 33.33.33.33/32
      network 100.100.100.3/32
   !
   vrf TENANT
      rd 100.100.100.3:50000
      route-target import evpn 50000:50000
      route-target export evpn 50000:50000
      redistribute connected
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
