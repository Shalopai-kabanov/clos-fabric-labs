Spine1#sh run
! Command: show running-config
! device: Spine1 (vEOS-lab, EOS-4.33.1.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Spine1
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
interface Ethernet1
   description TO_LEAF1_E1
   no switchport
   ip address 10.0.0.0/31
!
interface Ethernet2
   description TO_LEAF2_E1
   no switchport
   ip address 10.0.0.2/31
!
interface Ethernet3
   description TO_LEAF3_E1
   no switchport
   ip address 10.0.0.4/31
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
!
interface Ethernet12
!
interface Loopback0
   ip address 1.1.1.1/32
!
interface Management1
!
ip routing
!
router bgp 65000
   router-id 1.1.1.1
   neighbor 10.0.0.1 remote-as 65101
   neighbor 10.0.0.1 send-community extended
   neighbor 10.0.0.3 remote-as 65102
   neighbor 10.0.0.3 send-community extended
   neighbor 10.0.0.5 remote-as 65103
   neighbor 10.0.0.5 send-community extended
   !
   address-family evpn
      neighbor 10.0.0.1 activate
      neighbor 10.0.0.1 next-hop-unchanged
      neighbor 10.0.0.3 activate
      neighbor 10.0.0.3 next-hop-unchanged
      neighbor 10.0.0.5 activate
      neighbor 10.0.0.5 next-hop-unchanged
   !
   address-family ipv4
      neighbor 10.0.0.1 activate
      neighbor 10.0.0.3 activate
      neighbor 10.0.0.5 activate
      network 1.1.1.1/32
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
