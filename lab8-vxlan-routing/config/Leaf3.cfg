Leaf3#sh run
! Command: show running-config
! device: Leaf3 (vEOS-lab, EOS-4.33.1.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Leaf3
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 100
   name RED_TRANSIT_TO_R1
!
vlan 200
   name BLUE_TRANSIT_TO_R1
!
vrf instance BLUE
!
vrf instance RED
!
interface Ethernet1
   description TO_SPINE2_E2
   no switchport
   ip address 10.0.0.11/31
!
interface Ethernet2
   description TO_SPINE1_E3
   no switchport
   ip address 10.0.0.5/31
!
interface Ethernet3
   description TRUNK_TO_R1_G0_0
   switchport trunk allowed vlan 100,200
   switchport mode trunk
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
!
interface Ethernet12
!
interface Loopback0
   ip address 33.33.33.33/32
!
interface Loopback1
   description VTEP
   ip address 100.100.100.3/32
!
interface Management1
!
interface Vlan100
   description RED_TRANSIT_TO_R1
   vrf RED
   ip address 172.16.100.1/30
!
interface Vlan200
   description BLUE_TRANSIT_TO_R1
   vrf BLUE
   ip address 172.16.200.1/30
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf BLUE vni 50200
   vxlan vrf RED vni 50100
!
ip routing
ip routing vrf BLUE
ip routing vrf RED
!
ip route vrf BLUE 10.10.10.0/24 172.16.200.2
ip route vrf RED 10.20.20.0/24 172.16.100.2
!
router bgp 65103
   router-id 33.33.33.33
   neighbor 10.0.0.4 remote-as 65000
   neighbor 10.0.0.4 send-community extended
   neighbor 10.0.0.10 remote-as 65001
   neighbor 10.0.0.10 send-community extended
   !
   address-family evpn
      neighbor 10.0.0.4 activate
      neighbor 10.0.0.10 activate
   !
   address-family ipv4
      neighbor 10.0.0.4 activate
      neighbor 10.0.0.10 activate
      network 33.33.33.33/32
      network 100.100.100.3/32
   !
   vrf BLUE
      rd 33.33.33.33:50200
      route-target import evpn 50200:50200
      route-target export evpn 50200:50200
      redistribute connected
      redistribute static
   !
   vrf RED
      rd 33.33.33.33:50100
      route-target import evpn 50100:50100
      route-target export evpn 50100:50100
      redistribute connected
      redistribute static
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
