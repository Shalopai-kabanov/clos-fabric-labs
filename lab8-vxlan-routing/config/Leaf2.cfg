Leaf2#sh run
! Command: show running-config
! device: Leaf2 (vEOS-lab, EOS-4.33.1.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Leaf2
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 20
   name HOST2_BLUE
!
vrf instance BLUE
!
interface Ethernet1
   description TO_SPINE1_E2
   no switchport
   ip address 10.0.0.3/31
!
interface Ethernet2
   description TO_SPINE2_E1
   no switchport
   ip address 10.0.0.9/31
!
interface Ethernet3
   description TO_HOST2_E0
   switchport access vlan 20
   spanning-tree portfast
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
!
interface Ethernet12
!
interface Loopback0
   ip address 22.22.22.22/32
!
interface Loopback1
   description VTEP
   ip address 100.100.100.2/32
!
interface Management1
!
interface Vlan20
   description HOST2_GW_BLUE
   vrf BLUE
   ip address virtual 10.20.20.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 20 vni 10020
   vxlan vrf BLUE vni 50200
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf BLUE
!
router bgp 65102
   router-id 22.22.22.22
   neighbor 10.0.0.2 remote-as 65000
   neighbor 10.0.0.2 send-community extended
   neighbor 10.0.0.8 remote-as 65001
   neighbor 10.0.0.8 send-community extended
   !
   vlan 20
      rd 22.22.22.22:10020
      route-target both 10020:10020
      redistribute learned
      redistribute learned remote
   !
   address-family evpn
      neighbor 10.0.0.2 activate
      neighbor 10.0.0.8 activate
   !
   address-family ipv4
      neighbor 10.0.0.2 activate
      neighbor 10.0.0.8 activate
      network 22.22.22.22/32
      network 100.100.100.2/32
   !
   vrf BLUE
      rd 22.22.22.22:50200
      route-target import evpn 50200:50200
      route-target export evpn 50200:50200
      redistribute connected
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
