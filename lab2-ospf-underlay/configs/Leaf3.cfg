! device: Leaf3 (vEOS-lab, EOS-4.33.1.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Leaf3
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
interface Ethernet1
   description TO_SPINE1_E3
   no switchport
   ip address 10.0.0.7/31
   ip ospf network point-to-point
!
interface Ethernet2
   description TO_SPINE2_E1
   no switchport
   ip address 10.0.0.11/31
   ip ospf network point-to-point
!
interface Ethernet3
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Loopback0
   ip address 33.33.33.33/32
!
interface Management1
!
ip routing
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
router ospf 1
   router-id 33.33.33.33
   passive-interface Loopback0
   network 10.0.0.6/31 area 0.0.0.0
   network 10.0.0.10/31 area 0.0.0.0
   network 33.33.33.33/32 area 0.0.0.0
   max-lsa 12000
!
end
