! device: Leaf4 (vEOS-lab, EOS-4.33.1.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Leaf4
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
interface Ethernet1
   description TO_SPINE1_E4
   no switchport
   ip address 10.0.0.9/31
   ip ospf network point-to-point
!
interface Ethernet2
   description TO_SPINE2_E2
   no switchport
   ip address 10.0.0.13/31
   ip ospf network point-to-point
!
interface Ethernet3
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Loopback0
   ip address 44.44.44.44/32
!
interface Management1
!
ip routing
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
router ospf 1
   router-id 44.44.44.44
   passive-interface Loopback0
   network 10.0.0.8/31 area 0.0.0.0
   network 10.0.0.12/31 area 0.0.0.0
   network 44.44.44.44/32 area 0.0.0.0
   max-lsa 12000
!
end
