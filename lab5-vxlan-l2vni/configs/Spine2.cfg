Spine2#sh run
! Command: show running-config
! device: Spine2 (vEOS-lab, EOS-4.33.1.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Spine2
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
interface Ethernet1
   description TO_LEAF3_E2
   no switchport
   ip address 10.0.0.10/31
   ip ospf network point-to-point
!
interface Ethernet2
   description TO_LEAF4_E2
   no switchport
   ip address 10.0.0.12/31
   ip ospf network point-to-point
!
interface Ethernet3
   description TO_LEAF1_E1
   no switchport
   ip address 10.0.0.14/31
   ip ospf network point-to-point
!
interface Ethernet4
   description TO_LEAF2_E1
   no switchport
   ip address 10.0.0.16/31
   ip ospf network point-to-point
!
interface Ethernet5
   description TO_SPINE1_E5
   no switchport
   ip address 10.0.0.1/31
   ip ospf network point-to-point
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Loopback0
   ip address 2.2.2.2/32
!
interface Management1
!
ip routing
!
router bgp 65001
   router-id 2.2.2.2
   maximum-paths 8
   neighbor 10.0.0.0 remote-as 65000
   neighbor 10.0.0.11 remote-as 65103
   neighbor 10.0.0.13 remote-as 65104
   neighbor 10.0.0.15 remote-as 65101
   neighbor 10.0.0.17 remote-as 65102
   redistribute connected
   !
   address-family evpn
      neighbor 10.0.0.0 activate
      neighbor 10.0.0.11 activate
      neighbor 10.0.0.13 activate
      neighbor 10.0.0.15 activate
      neighbor 10.0.0.17 activate
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
