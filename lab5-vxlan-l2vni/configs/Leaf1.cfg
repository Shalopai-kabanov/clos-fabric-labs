Leaf1#sh run 
! Command: show running-config
! device: Leaf1 (vEOS-lab, EOS-4.33.1.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Leaf1
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 10
!
interface Ethernet1
   description TO_SPINE1
   no switchport
   ip address 10.0.0.1/31
!
interface Ethernet2
   description TO_SPINE2
   no switchport
   ip address 10.0.0.9/31
!
interface Ethernet3
   description TO_HOST1
   switchport access vlan 10
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Loopback0
   ip address 11.11.11.11/32
!
interface Loopback1
   ip address 100.100.100.1/32
!
interface Management1
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
!
ip routing
!
router bgp 65101
   router-id 11.11.11.11
   neighbor 10.0.0.0 remote-as 65000
   neighbor 10.0.0.0 send-community extended
   neighbor 10.0.0.8 remote-as 65001
   neighbor 10.0.0.8 send-community extended
   !
   vlan 10
      rd 100.100.100.1:10010
      route-target both 10010:10010
      redistribute learned
      redistribute learned remote
   !
   address-family evpn
      neighbor 10.0.0.0 activate
      neighbor 10.0.0.8 activate
   !
   address-family ipv4
      neighbor 10.0.0.0 activate
      neighbor 10.0.0.8 activate
      network 11.11.11.11/32
      network 100.100.100.1/32
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
