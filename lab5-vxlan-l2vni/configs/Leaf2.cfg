Leaf2#sh run 
! Command: show running-config
! device: Leaf2 (vEOS-lab, EOS-4.33.1.1F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Leaf2
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 10
!
interface Ethernet1
   description TO_SPINE2_E4
   no switchport
   ip address 10.0.0.17/31
!
interface Ethernet2
   description TO_SPINE1_E2
   no switchport
   ip address 10.0.0.5/31
!
interface Ethernet3
   switchport access vlan 10
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Loopback0
   ip address 22.22.22.22/32
!
interface Loopback1
   ip address 100.100.100.2/32
!
interface Management1
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan flood vtep 100.100.100.1 100.100.100.3 100.100.100.4
!
ip routing
!
router bgp 65102
   router-id 22.22.22.22
   maximum-paths 8
   neighbor 10.0.0.4 remote-as 65000
   neighbor 10.0.0.16 remote-as 65001
   redistribute connected
   !
   vlan 10
      rd 100.100.100.2:10010
      route-target both 10010:10010
      redistribute learned
   !
   address-family evpn
      neighbor 10.0.0.4 activate
      neighbor 10.0.0.16 activate
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
